name: EssayPublisher

options:
  bundleIdPrefix: com.ryuichi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "1.0"

targets:
  EssayPublisher:
    type: application
    platform: iOS
    sources:
      - path: EssayPublisher
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryuichi.essaypublisher
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ogygia
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "用于选择图片发布到博客"
        INFOPLIST_KEY_NSCameraUsageDescription: "用于拍照发布到博客"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: 2FJFJ2WAF8
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_FILE: EssayPublisher/Info.plist

  EssayPublisherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: EssayPublisherTests
    dependencies:
      - target: EssayPublisher
